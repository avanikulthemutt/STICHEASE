
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mira | Stitchease Assistant</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>

:root {
    --navy: #76551B;
    --deep: #F5EFDF;
    --secondary: #FFF8E8;
    --yellow: #E8B83F;
    --white: #51452F;
    --muted: #786F60;
    --line: #E8D9B8;
}


* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: "DM Sans", Arial, sans-serif;
    background: transparent;
    color: var(--white);
}

button, input { font: inherit; }

#chatbot {
    position: absolute;
    right: 0;
    bottom: 0;
    z-index: 99999;
}

#chatbotToggle {
    width: 62px;
    height: 62px;
    border: 2px solid var(--yellow);
    border-radius: 50%;
    background: var(--yellow);
    color: var(--navy);
    font-size: 27px;
    cursor: pointer;
    box-shadow: 0 5px 20px rgba(100,75,30,.15);
    transition: .25s;
}

#chatbotToggle:hover {
    transform: translateY(-5px);
    background: #F3D47F;
}

#chatbotWindow {
    display: none;
    position: absolute;
    right: 0;
    bottom: 76px;
    width: min(370px, calc(100vw - 32px));
    height: min(520px, calc(100vh - 90px));
    flex-direction: column;
    overflow: hidden;
    background: #FFFCF5;
    border: 1px solid var(--yellow);
    border-radius: 20px;
    box-shadow: 0 12px 35px rgba(100,75,30,.15);
}

#chatbotWindow.open {
    display: flex;
    animation: openChat .25s ease;
}

@keyframes openChat {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

/* HEADER */

.chatbot-header {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 15px;
    background: var(--deep);
    border-bottom: 3px solid var(--yellow);
}

.bot-avatar {
    width: 43px;
    height: 43px;
    border-radius: 50%;
    background: var(--yellow);
    color: var(--navy);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
}

.bot-info { flex: 1; }

.bot-info strong {
    display: block;
    font-family: "Playfair Display", serif;
    font-size: 19px;
}

.bot-info small {
    display: block;
    margin-top: 4px;
    font-size: 11px;
    color: #9A701B;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

.header-actions button {
    border: none;
    background: transparent;
    color: var(--white);
    cursor: pointer;
    font-size: 20px;
}

#chatbotClose { font-size: 27px; }

/* MESSAGES */

#chatbotMessages {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
    overflow-y: auto;
    padding: 16px;
    background: #FFFCF5;
    scroll-behavior: smooth;
}

.bot-message, .user-message {
    max-width: 88%;
    padding: 11px 14px;
    border-radius: 15px;
    font-size: 13px;
    line-height: 1.6;
    overflow-wrap: anywhere;
    white-space: pre-line;
    animation: messageIn .25s ease;
}

@keyframes messageIn {
    from { opacity: 0; transform: translateY(7px); }
    to { opacity: 1; transform: translateY(0); }
}

.bot-message {
    align-self: flex-start;
    color: var(--white);
    background: var(--secondary);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
}

.user-message {
    align-self: flex-end;
    color: var(--navy);
    background: var(--yellow);
    border-bottom-right-radius: 4px;
}

.quick-title {
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1px;
    color: #9A701B;
}

.quick-options {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    width: 100%;
}

.quick-btn {
    border: 1px solid var(--yellow);
    background: transparent;
    color: #9A701B;
    border-radius: 18px;
    padding: 8px 11px;
    font-size: 11px;
    cursor: pointer;
    transition: .2s;
}

.quick-btn:hover {
    background: var(--yellow);
    color: var(--navy);
}

/* TYPING */

.typing {
    display: flex;
    gap: 5px;
    align-items: center;
    width: fit-content;
    padding: 13px 16px;
    background: var(--secondary);
    border-radius: 14px;
}

.typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--yellow);
    animation: typing 1s infinite;
}

.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }

@keyframes typing {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-5px); }
}

/* INPUT */

.chatbot-input {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: var(--deep);
    border-top: 1px solid var(--line);
}

.chatbot-input input {
    flex: 1;
    min-width: 0;
    height: 42px;
    padding: 10px 13px;
    border: 1px solid var(--line);
    border-radius: 10px;
    outline: none;
    background: var(--secondary);
    color: var(--white);
    font-size: 13px;
}

.chatbot-input input::placeholder { color: var(--muted); }

.chatbot-input input:focus { border-color: #9A701B; }

.chatbot-input button {
    padding: 9px 15px;
    border: none;
    border-radius: 10px;
    background: var(--yellow);
    color: var(--navy);
    font-weight: bold;
    cursor: pointer;
}

.chatbot-input button:hover { background: #F3D47F; }

@media(max-width:480px) {
    #chatbotWindow {
        width: min(370px, calc(100vw - 32px));
        height: min(520px, calc(100vh - 90px));
    }
}
</style>
</head>

<body>

<div id="chatbot">

    <button id="chatbotToggle" aria-label="Open Mira chatbot">💬</button>

    <div id="chatbotWindow">

        <div class="chatbot-header">
            <div class="bot-avatar">✦</div>

            <div class="bot-info">
                <strong>Mira</strong>
                <small>● Stitchease Style Assistant</small>
            </div>

            <div class="header-actions">
                <button id="clearChat" title="Clear chat">↻</button>
                <button id="chatbotClose" aria-label="Close chat">×</button>
            </div>
        </div>

        <div id="chatbotMessages">
            <div class="bot-message">
                Hi there! Welcome to Stitchease! 💛

                I'm Mira, your personal boutique assistant.

                Whether you need help planning an outfit, booking an appointment or checking your order, I'm here to help!

                What can I help you with today? 😊
            </div>

            <div class="quick-title">EXPLORE QUICK HELP</div>

            <div class="quick-options">
                <button class="quick-btn" data-question="How do I book an appointment?">📅 Appointments</button>
                <button class="quick-btn" data-question="How do I place a custom order?">👗 Custom Orders</button>
                <button class="quick-btn" data-question="What measurements do I need?">📏 Measurements</button>
                <button class="quick-btn" data-question="How can I track my order?">📦 Track Order</button>
                <button class="quick-btn" data-question="Can you suggest an outfit for a wedding?">✨ Outfit Ideas</button>
                <button class="quick-btn" data-question="What fabrics are suitable for a festive outfit?">🧵 Fabrics</button>
            </div>
        </div>

        <form id="chatbotForm" class="chatbot-input">
            <input
                type="text"
                id="chatbotText"
                placeholder="Ask Mira anything..."
                autocomplete="off"
                required>
            <button type="submit">Send</button>
        </form>

    </div>
</div>

<script>
const toggle = document.getElementById("chatbotToggle");
const closeButton = document.getElementById("chatbotClose");
const clearButton = document.getElementById("clearChat");
const chatWindow = document.getElementById("chatbotWindow");
const chatForm = document.getElementById("chatbotForm");
const chatInput = document.getElementById("chatbotText");
const chatMessages = document.getElementById("chatbotMessages");

const welcomeMessage = `
Hi there! Welcome to Stitchease! 💛

I'm Mira, your personal boutique assistant.

Whether you need help planning an outfit, booking an appointment or checking your order, I'm here to help!

What can I help you with today? 😊
`;

// Notify the main website when Mira opens or closes.
function notifyParentChatbotState(isOpen) {
    if (window.parent && window.parent !== window) {
        window.parent.postMessage(
            {
                type: "STITCHEASE_CHATBOT_RESIZE",
                open: isOpen
            },
            window.location.origin
        );
    }
}

toggle.addEventListener("click", () => {
    const isOpening = !chatWindow.classList.contains("open");
    chatWindow.classList.toggle("open", isOpening);
    notifyParentChatbotState(isOpening);
});

closeButton.addEventListener("click", () => {
    chatWindow.classList.remove("open");
    notifyParentChatbotState(false);
});

function addMessage(message, type) {
    const div = document.createElement("div");
    div.className = type;
    div.textContent = message;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

function getMiraResponse(question) {
    const q = question.toLowerCase().trim();

    if (/^(hi|hello|hey|hii|good morning|good evening)\b/.test(q)) {
        return "Hello! Lovely to see you here! 😊 I'm Mira, your Stitchease assistant. Are you planning a new outfit or would you like help with an existing order?";
    }

    if (q.includes("appointment") || q.includes("book") || q.includes("visit")) {
        return "📅 BOOK AN APPOINTMENT\n\n1. Log in to your Stitchease account.\n2. Open the Book Appointment section.\n3. Select your preferred date and time.\n4. Add the purpose of your visit.\n5. Submit your booking.\n\nYou can check your appointment details in the My Appointments section. 💛";
    }

    if (q.includes("reschedule") || q.includes("change appointment")) {
        return "Need to change your appointment? Please check your appointment details in your account and contact the boutique to arrange a new date or time. 😊";
    }

    if (q.includes("cancel appointment")) {
        return "If you need to cancel an appointment, check the appointment section in your account for available cancellation options. You can also contact the boutique team for assistance.";
    }

    if (q.includes("measurement") || q.includes("size") || q.includes("measure")) {
        return "📏 MEASUREMENTS GUIDE\n\nYou can save your measurements in My Profile.\n\nCommon measurements include:\n• Bust\n• Waist\n• Hip\n• Shoulder\n• Sleeve length\n• Dress length\n• Height\n\nUse centimetres for consistency. For accurate fitting, we recommend taking measurements carefully or getting assistance at the boutique.";
    }

    if (q.includes("custom order") || q.includes("place order") || q.includes("new order") || q.includes("custom outfit")) {
        return "👗 CREATE YOUR CUSTOM OUTFIT\n\nGo to My Orders after logging in.\n\nYou can provide:\n• Outfit type\n• Preferred colour\n• Fabric choice\n• Occasion\n• Design and customization details\n• Expected duration\n\nSubmit your request and the boutique can review your requirements. Happy designing! ✨";
    }

    if (q.includes("track") || q.includes("status") || q.includes("progress") || q.includes("where is my order")) {
        return "📦 TRACK YOUR ORDER\n\nLog in to your Stitchease account and open My Orders.\n\nYour order timeline can show:\n\n1. Placed\n2. Confirmed\n3. In Progress\n4. Ready\n5. Completed\n\nThe displayed status reflects the latest update made by the boutique.";
    }

    if (q.includes("wedding") || q.includes("party") || q.includes("festive") || q.includes("occasion")) {
        return "✨ OUTFIT INSPIRATION\n\nFor special occasions, you could consider:\n\n• Wedding: Elegant lehenga or silk saree blouse.\n• Festive event: Embroidered kurti or anarkali.\n• Party: Stylish gown or contemporary dress.\n• Family function: Classic ethnic suit.\n\nChoose a style that feels comfortable and matches your occasion. You can share your preferred design in a custom order!";
    }

    if (q.includes("kurti") || q.includes("lehenga") || q.includes("saree") || q.includes("gown") || q.includes("dress") || q.includes("blouse")) {
        return "👗 We can help you plan customized outfits such as kurtis, saree blouses, lehengas, gowns and dresses.\n\nTell me the occasion, preferred colour and style, and I can suggest some ideas!";
    }

    if (q.includes("fabric") || q.includes("material") || q.includes("cotton") || q.includes("silk") || q.includes("chiffon")) {
        return "🧵 FABRIC GUIDE\n\nHere are some popular choices:\n\n• Cotton – Comfortable for everyday wear.\n• Silk – Elegant for festive occasions.\n• Chiffon – Lightweight and flowy.\n• Georgette – Great for dresses and occasion wear.\n• Linen – Breathable and comfortable.\n\nThe best choice depends on your outfit, occasion and comfort. You can discuss the final selection with the boutique.";
    }

    if (q.includes("price") || q.includes("cost") || q.includes("payment") || q.includes("expensive")) {
        return "💰 PRICING & PAYMENT\n\nThe website provides an estimated price when you place a custom order. The final price may depend on the fabric, design and customization requirements.\n\nThe boutique will confirm the final amount after reviewing your order.";
    }

    if (q.includes("profile") || q.includes("account") || q.includes("login") || q.includes("register") || q.includes("sign up")) {
        return "👤 YOUR STITCHEASE ACCOUNT\n\nYou can register or log in from the homepage.\n\nYour account helps you manage:\n• Personal details\n• Body measurements\n• Appointments\n• Custom orders\n• Order tracking\n\nKeep your profile updated for a smoother boutique experience!";
    }

    if (q.includes("contact") || q.includes("phone") || q.includes("boutique address") || q.includes("call")) {
        return "💛 CONTACT SNK FASHIONHOUSE\n\nPhone: +91 98450 12938\nInstagram: @snk_fashionhouse\n\nInstagram: https://www.instagram.com/snk_fashionhouse/\n\nFor specific enquiries, please contact the boutique team directly.";
    }

    if (q.includes("service") || q.includes("what do you do") || q.includes("what can you do")) {
        return "✨ STITCHEASE SERVICES\n\nWe help you with:\n\n• Custom outfit requests\n• Appointment booking\n• Measurement management\n• Outfit customization details\n• Order status tracking\n\nOur goal is to make your boutique experience simple and convenient!";
    }

    if (q.includes("thank")) {
        return "You're very welcome! 💛 I'm always happy to help. Have a lovely day, and happy styling!";
    }

    if (q.includes("bye") || q.includes("goodbye")) {
        return "Goodbye! Thank you for visiting Stitchease. Keep dreaming up beautiful outfits. See you soon! 💛";
    }

    if (q.includes("help")) {
        return "Of course! 😊 I can help you with:\n\n📅 Appointments\n👗 Custom outfits\n📏 Measurements\n📦 Order tracking\n🧵 Fabric suggestions\n💰 Pricing information\n\nChoose one of the quick-help buttons or type your question!";
    }

    return "That's interesting! 😊 I may need a little more detail to help you properly.\n\nI can currently answer questions about appointments, custom outfits, measurements, fabrics, pricing, accounts and order tracking.";
}

function sendQuestion(question) {
    if (!question.trim()) return;

    addMessage(question, "user-message");

    const typing = document.createElement("div");
    typing.className = "typing";

    for (let i = 0; i < 3; i++) {
        const dot = document.createElement("span");
        typing.appendChild(dot);
    }

    chatMessages.appendChild(typing);
    chatMessages.scrollTop = chatMessages.scrollHeight;

    setTimeout(() => {
        typing.remove();
        addMessage(getMiraResponse(question), "bot-message");
    }, 700);
}

chatForm.addEventListener("submit", function(event) {
    event.preventDefault();

    const question = chatInput.value.trim();
    if (!question) return;

    chatInput.value = "";
    sendQuestion(question);
});

document.querySelectorAll(".quick-btn").forEach(button => {
    button.addEventListener("click", () => {
        sendQuestion(button.dataset.question);
    });
});

// CLEAR CHAT
clearButton.addEventListener("click", () => {
    chatMessages.innerHTML = "";

    addMessage(welcomeMessage, "bot-message");

    const title = document.createElement("div");
    title.className = "quick-title";
    title.textContent = "QUICK HELP";
    chatMessages.appendChild(title);

    const options = document.createElement("div");
    options.className = "quick-options";

    const questions = [
        ["📅 Appointments", "How do I book an appointment?"],
        ["👗 Custom Orders", "How do I place a custom order?"],
        ["📏 Measurements", "What measurements do I need?"],
        ["📦 Track Order", "How can I track my order?"],
        ["✨ Outfit Ideas", "Can you suggest an outfit for a wedding?"],
        ["🧵 Fabrics", "What fabrics are suitable for a festive outfit?"]
    ];

    questions.forEach(([label, question]) => {
        const button = document.createElement("button");
        button.className = "quick-btn";
        button.textContent = label;
        button.dataset.question = question;

        button.addEventListener("click", () => {
            sendQuestion(question);
        });

        options.appendChild(button);
    });

    chatMessages.appendChild(options);
    chatMessages.scrollTop = chatMessages.scrollHeight;
});
</script>

</body>
</html>
